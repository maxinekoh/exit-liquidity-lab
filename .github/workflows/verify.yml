name: Verify vault accounting
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:all
      - name: Scan runtime dependency tree
        run: npm ls --omit=dev --all
